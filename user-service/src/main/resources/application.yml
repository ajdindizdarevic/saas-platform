spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Multi-tenancy is configured programmatically in DatabaseConfig.java
        # (Hibernate 7 requires bean instances, not class-name strings)

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-for-development-only}
  expiration: 86400000         # 24h access token  (ms)
  refresh-expiration: 604800000 # 7d refresh token  (ms)

rabbitmq:
  exchange:
    tenant: tenant.exchange
    dead-letter: dead.letter.exchange
  queue:
    tenant-created: tenant.created.user-service.queue
    tenant-created-dlq: tenant.created.user-service.dlq
    user-registered: user.registered.onboarding-service.queue
    user-registered-dlq: user.registered.onboarding-service.dlq
  routing-key:
    tenant-created: tenant.created
    user-registered: user.registered

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

app:
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:ChangeMe123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.userservice: INFO
    org.springframework.security: WARN