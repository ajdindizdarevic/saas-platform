spring:
  application:
    name: tenant-service

  datasource:
    url: jdbc:postgresql://localhost:5432/tenant_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-for-development-only}

rabbitmq:
  exchange:
    tenant: tenant.exchange
    dead-letter: dead.letter.exchange
  queue:
    tenant-approved: tenant.approved.queue
    tenant-approved-dlq: tenant.approved.dlq
    tenant-created: tenant.created.queue
  routing-key:
    tenant-approved: tenant.approved
    tenant-created: tenant.created

cors:
  allowed-origins:
    - http://localhost:4200
    - http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.tenantservice: INFO
    org.springframework.security: WARN