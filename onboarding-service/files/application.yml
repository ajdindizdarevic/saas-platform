spring:
  application:
    name: onboarding-service

  datasource:
    url: jdbc:postgresql://localhost:5432/onboarding_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

server:
  port: 8081
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-for-development-only}
  expiration: 86400000  # 24 hours in milliseconds

rabbitmq:
  exchange:
    tenant: tenant.exchange
    dead-letter: dead.letter.exchange
  queue:
    tenant-approved: tenant.approved.queue
    tenant-approved-dlq: tenant.approved.dlq
  routing-key:
    tenant-approved: tenant.approved

cors:
  allowed-origins:
    - http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.saas.onboarding: INFO
    org.springframework.security: WARN
